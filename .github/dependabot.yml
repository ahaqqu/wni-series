version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # astro check peer-supports only typescript ^5 || ^6 (@astrojs/check <=0.9.12),
    # so a TS 7 bump breaks apps/platform typecheck. Remove once Astro supports TS 7.
    ignore:
      - dependency-name: 'typescript'
        update-types:
          - 'version-update:semver-major'
    groups:
      dev-tooling:
        patterns:
          - 'prettier*'
          - 'markdownlint*'
          - 'turbo'
          - 'typescript'
          - 'vitest'
          - '@playwright/test'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directory: /infra/compose
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
