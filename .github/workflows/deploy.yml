name: Deploy

# Guarded on purpose. Set repository variable DEPLOY_ENABLED=true only after:
#   - Phase 0 staging deploy is proven
#   - production secrets/environments are configured
#   - Mayar KYC and production keys are ready (for payment releases)
#
# The workflow is a target scaffold; adjust paths once apps exist.

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options: [staging, production]
      ref:
        description: Git ref to deploy (default main)
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: pnpm/action-setup@v6
        with:
          version: 12.14.0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm verify:docs

      - name: Build static + API
        run: |
          pnpm build
          docker build -t "ghcr.io/${{ github.repository_owner }}/wni-api:${GITHUB_SHA}" services/api

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push API image
        run: docker push "ghcr.io/${{ github.repository_owner }}/wni-api:${GITHUB_SHA}"

      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload static release
        run: |
          # shellcheck disable=SC2029
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "mkdir -p /srv/wni/releases/${GITHUB_SHA}/platform /srv/wni/releases/${GITHUB_SHA}/play"
          rsync -az --delete apps/platform/dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/wni/releases/${GITHUB_SHA}/platform/"
          # Add one rsync per game once games exist:
          # rsync -az --delete games/pejuang-nafkah/dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/srv/wni/releases/${GITHUB_SHA}/play/pejuang-nafkah/"

      - name: Migrate, swap, restart, smoke
        run: |
          # shellcheck disable=SC2029
          ssh "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "RELEASE_SHA=${GITHUB_SHA} bash -s" <<'EOF'
          set -euo pipefail
          cd /srv/wni
          export RELEASE_TAG="${RELEASE_SHA}"
          docker compose --env-file .env -f compose.yaml pull api
          docker compose --env-file .env -f compose.yaml run --rm migrate
          ln -sfn "releases/${RELEASE_SHA}" current
          docker compose --env-file .env -f compose.yaml up -d api caddy
          curl -fsS https://wniseries.ahaqqu.com/api/readyz
          EOF

      - name: Purge Cloudflare HTML cache
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -z "${CF_API_TOKEN:-}" ] || [ -z "${CF_ZONE_ID:-}" ]; then
            echo "Cloudflare purge secrets not set; skipping."
            exit 0
          fi
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}'
